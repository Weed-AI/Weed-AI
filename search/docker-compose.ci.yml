# CI-only overrides, layered on docker-compose.yml via COMPOSE_FILE in
# .github/workflows/frontend.yml.
services:
  elasticsearch:
    # Production runs 7.16.2, whose bundled JDK 17.0.1 crashes on cgroup v2
    # hosts (current GitHub runners): NPE in CgroupV2Subsystem, including in
    # the startup helper JVMs, which ignore ES_JAVA_OPTS/JAVA_TOOL_OPTIONS.
    # 7.17.x is the same major line with a fixed JDK, and behaves the same
    # for everything CI tests (incl. script.allowed_contexts).
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29

events {
}

http {
    include mime.types;

    # Security hardening (Nov 2026, Wiz findings):
    # - don't advertise the nginx version
    server_tokens off;

    server {
        # Cleartext HTTP/1.1 only. HTTP/2 is deliberately NOT enabled
        # (no `http2` on listen, no `http2 on;`), and there is no QUIC,
        # `resolver` or mail block, so CVE-2026-123007 / -123633 / -123634 /
        # -121810 / -113425 are not reachable through this config.
        # Do not add http2 here; TLS/HTTP2 is terminated upstream.
        listen 80;

        server_name localhost 127.0.0.1;

        gzip on;
        gzip_disable "msie6";
        gzip_comp_level 6;
		gzip_min_length 1100;
		gzip_buffers 16 8k;
		gzip_proxied any;
        gzip_types
			text/plain
			text/css
			text/js
			text/xml
			text/javascript
			application/javascript
			application/json
			application/xml
			application/rss+xml
			image/svg+xml;

        location /admin/ {
            proxy_pass              http://django:8000/admin/;
        }

        # Wiz Finding 1 (CRITICAL): /api/login_google/ issues a session for any
        # email without verifying a Google ID token. Blocked at the proxy until
        # the verified-token version of the view is deployed. Regex location so
        # it takes precedence over the /api/ prefix and catches slash variants.
        location ~* ^/api/+login_google {
            return 403;
        }

        # Wiz Finding 3: only the single search endpoint the UI uses is proxied.
        location = /elasticsearch/weedid/_msearch {
            limit_except POST {
                deny all;
            }
            client_max_body_size    64k;
            proxy_pass              http://django:8000/elasticsearch/weedid/_msearch;
        }

        location /elasticsearch/ {
            return 403;
        }

        location /api/ {
            proxy_pass              http://django:8000/api/;
            client_max_body_size    5000M;
        }

        location /sitemap.xml {
            proxy_pass              http://django:8000/sitemap.xml;
        }

        location /tus/ {
            proxy_pass              http://django:8000/tus/;
            proxy_request_buffering off;
            proxy_http_version      1.1;
            proxy_set_header        X-Forwarded-Host $host;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Upgrade $http_upgrade;
            proxy_set_header        Connection "upgrade";
            client_max_body_size    0;
        }

        location /code/download/ {
            alias /media/download/;
        }

        location /code/thumbnails/ {
            alias /media/thumbnails/;
        }

        location /mystatic/ {
            alias /media/mystatic/;
        }

        location / {
            proxy_pass              http://reactivesearch:80;
        }
    }
}

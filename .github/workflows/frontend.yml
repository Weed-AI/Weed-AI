name: Check search frontend

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  check-search-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The CVAT UI submodule builds FROM node:lts-slim, which now resolves to
      # a Node far too new for its 2021-era webpack. Pre-seed that tag with
      # Node 16: it needs npm >= 7 for `npm run --workspace`, but Node 17+
      # breaks old webpack (OpenSSL 3).
      - name: Pin node:lts-slim for the CVAT UI build
        run: |
          docker pull node:16-slim
          docker tag node:16-slim node:lts-slim
      - name: Bring system up
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
            set -x
            cd search
            mkdir -p live-data
            cat > .env <<HERE
            DJANGO_SECRET_KEY=mysecret
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=postgres
            POSTGRES_DB=weedai
            WEEDCOCO_VERSION=$MERGE_SHA
            WEEDCOCO_REPO=${{ github.repository }}
            SEND_EMAIL=False
            CVAT_BASEPATH='/cvat-annotation'
            GIT_REMOTE_PATH=/tmp/git_remote
            DVC_REMOTE_PATH=/tmp/dvc_remote
            HTTPS_HOST=localhost
            HERE
            cat .env
            docker compose up -d --build
            sleep 1
            get_statuses() {
              docker compose ps -q | xargs docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}'
            }
            while get_statuses | grep -q starting; do sleep 1; done
            if get_statuses | grep -q -e exited -e restarting -e unhealthy; then false; fi
      # Host-side Python only runs the indexing script against ES on :9200.
      # 3.8 is the oldest version setup-python still provides on ubuntu-latest.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install weedcoco library
        run: |
          pip install .
      - name: Index test data
        run: |
          bash search/scripts/index_test_images.sh
      - name: Django tests (inside the running container)
        run: |
          cd search
          docker compose exec -T django python manage.py test weedid --noinput
      - name: Security checks for Wiz findings
        run: |
          cd search
          ES_URL=http://localhost:9200 bash scripts/check_wiz_fixes.sh http://localhost
      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: yarn
          cache-dependency-path: search/yarn.lock
      # Cypress 7 predates cypress-io/github-action's current releases,
      # so install and run it directly.
      - name: Cypress run
        working-directory: search
        env:
          ELECTRON_ENABLE_LOGGING: 1
        run: |
          yarn install --frozen-lockfile
          yarn cypress run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: search/cypress/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: search/cypress/videos
      - name: Check logs upon failure
        run: |
            cd search
            docker compose logs --tail="all"
            docker compose ps
        if: ${{ failure() }}
      - name: Shutdown
        run: |
            cd search
            docker compose down
        if: ${{ always() }}

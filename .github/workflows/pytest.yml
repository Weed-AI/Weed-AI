name: weedcoco python package tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Python 3.7 (what production runs) is no longer installable via
    # setup-python on current runners, so use the official image instead.
    container: python:3.7-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          pip install .[test]
          rm -rf build
      - name: Test
        run: pytest --cov=weedcoco/ --cov-report=xml
      - uses: codecov/codecov-action@v4
        # Upload only from the upstream repo; forks have no Codecov token.
        if: github.repository == 'Weed-AI/Weed-AI'
        continue-on-error: true
        with:
          flags: weedcoco
          fail_ci_if_error: false

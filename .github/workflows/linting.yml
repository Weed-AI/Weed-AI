name: Lint code style & smells

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Same versions as .pre-commit-config.yaml, so CI and local hooks agree.
      # click is pinned because black 22.1.0 breaks with click >= 8.1.
      - name: Install linters
        run: pip install black==22.1.0 click==8.0.4 flake8==4.0.1
      - name: flake8
        run: flake8 .
      - name: black
        run: black --check --diff .
